name: Tigerair price monitor

on:
  push:
    branches: [main]
    paths: [config.toml, monitor.py]   # editing the settings re-runs immediately

  # 排程設
  # schedule:
  #  - cron: "*/5 * * * *"  # every 5 minutes (GitHub minimum; runs may start late or be skipped)
  workflow_dispatch:        # allows a manual "Run workflow" button
    inputs:
      test_email:
        description: "寄一封測試信（不論是否低於門檻）"
        type: boolean
        default: false
      scheduled:
        description: "由外部排程（cron-job.org）觸發"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: monitor
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      TZ: Asia/Taipei
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Run monitor (API only, no browser)
        run: python -u monitor.py
        env:
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASS: ${{ secrets.SMTP_PASS }}
          MAIL_TO: ${{ secrets.MAIL_TO }}
          TEST_EMAIL: ${{ inputs.test_email }}
          SCHEDULED: ${{ github.event_name == 'schedule' || inputs.scheduled }}

      - name: Commit report and history
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs data
          git diff --cached --quiet || git commit -m "Update prices $(date '+%Y-%m-%d %H:%M')"
          git pull --rebase --quiet
          git push
