# ===========================================================
#  虎航票價監控設定檔
#  在 GitHub 網頁上修改並 Commit 後，會自動重新執行一次。
#  「#」後面是註解，不影響設定。
# ===========================================================

[trip]
# 所有航線共用的條件
# 機場代碼（3 個英文字母），常用：
#   台灣  TPE 台北(桃園)、KHH 高雄、RMQ 台中
#   日本  NRT 東京(成田)、KIX 大阪(關西)、NGO 名古屋、FUK 福岡、CTS 札幌、OKA 沖繩、
#         OKJ 岡山、KMJ 熊本、KMQ 小松、SDJ 仙台、HKD 函館、ISG 石垣
#   韓國  GMP 首爾(金浦)、ICN 首爾(仁川)、PUS 釜山、CJU 濟州
#   其他  DAD 峴港
origin = "KHH"   # 出發地

# 日期格式 YYYY-MM-DD，不用加引號
earliest_departure = 2026-11-05   # 最早去程日期
latest_return      = 2026-12-30   # 最晚回程日期

# 玩幾天（含出發與回程當天），可填多個，例如 [4, 5, 6]
trip_days = [6, 7]

# 旅客人數（兒童：2 歲以上、未滿 12 歲；虎航兒童與成人同價）
adults   = 2
children = 1

# ===========================================================
#  目的地：一條航線一段 [[route]]，要加航線就複製一段、要停就刪掉一段
#  tax_outbound / tax_return = 每人去程 / 回程稅金（台幣），用來估算含稅價。
#  不同航線稅金不同，新增航線時請點報表的「訂票 ↗」到訂票頁查一次填入。
# ===========================================================

[[route]]
destination  = "KIX"   # 大阪(關西)
tax_outbound = 1100    # 2026/10/15 實查
tax_return   = 1785    # 實查 1,685～1,785，取高值

[[route]]
destination  = "NGO"   # 名古屋
tax_outbound = 1100    # 2026/10/15 實查
tax_return   = 1393

[[route]]
destination  = "FUK"   # 福岡
tax_outbound = 1100    # 2026/10/15 實查
tax_return   = 1463

[alert]
# 每人來回含稅不可以大於多少錢（台幣）；低於或等於這個金額會寄信並在報表標示（所有航線共用）
max_price_per_person = 10500

[report]
# 每條航線列出最便宜的前幾組
top_n = 10

# 執行頻率不在這裡設定，由 .github/workflows/monitor.yml 的 cron 決定（目前每 5 分鐘）。
